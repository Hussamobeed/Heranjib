name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Decode Keystore from Secret
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/heranjib.keystore

      - name: Auto-increment Version Code
        run: |
          # نحدد ملف البناء (Groovy أو Kotlin DSL)
          if [ -f app/build.gradle.kts ]; then
            BUILD_FILE="app/build.gradle.kts"
          elif [ -f app/build.gradle ]; then
            BUILD_FILE="app/build.gradle"
          else
            echo "Build file not found!"
            exit 1
          fi
          
          # نقرأ الرقم الحالي (يعمل مع: versionCode 2  أو  versionCode = 2)
          CURRENT_CODE=$(grep -oP 'versionCode\s*[= ]?\s*\K\d+' "$BUILD_FILE")
          
          # نزيده بواحد
          NEW_CODE=$((CURRENT_CODE + 1))
          
          # نستبدل الرقم في الملف (يعمل مع الصيغتين)
          sed -i -E "s/(versionCode\s*[= ]?\s*)[0-9]+/\1$NEW_CODE/" "$BUILD_FILE"
          
          echo "✅ Version code updated: $CURRENT_CODE → $NEW_CODE"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/keystore/heranjib.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/keystore/heranjib.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
